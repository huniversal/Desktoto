name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and compute version
        id: version
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::태그 형식은 v1.2.3 또는 v1.2.3-rc.1 이어야 합니다: $TAG_NAME"
            exit 1
          fi
          echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[2]}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        working-directory: apps/macos
        run: swift test
      - name: Package app bundle
        working-directory: apps/macos
        env:
          VERSION: ${{ steps.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: sh scripts/build-app.sh
      - name: Create zip
        id: zip
        working-directory: apps/macos/build
        run: |
          zip_name="Desktoto-${TAG_NAME#v}.zip"
          ditto -c -k --keepParent Desktoto.app "$zip_name"
          shasum -a 256 "$zip_name" | tee "$zip_name.sha256"
          echo "name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip_name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # 랜딩 페이지의 다운로드 버튼이 releases/latest/download/Desktoto.dmg로 항상 최신을 받도록 파일 이름에 버전을 넣지 않는다.
      - name: Create dmg
        working-directory: apps/macos/build
        run: |
          staging=$(mktemp -d)
          ditto Desktoto.app "$staging/Desktoto.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Desktoto -srcfolder "$staging" -ov -format UDZO Desktoto.dmg
          shasum -a 256 Desktoto.dmg | tee Desktoto.dmg.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_NAME: ${{ steps.zip.outputs.name }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            "apps/macos/build/$ZIP_NAME" \
            "apps/macos/build/$ZIP_NAME.sha256" \
            "apps/macos/build/Desktoto.dmg" \
            "apps/macos/build/Desktoto.dmg.sha256" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${flags[@]}"

  # 정식 릴리스가 올라간 뒤 Homebrew tap의 cask 버전과 해시를 갱신한다.
  # 릴리스와 따로 둔 job이라 이 job이 실패해도 이미 올라간 GitHub Release는 그대로 남는다.
  # 프리릴리스는 brew upgrade로 사용자에게 가지 않도록 건너뛴다.
  update-tap:
    name: Update Homebrew tap
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: update-homebrew-tap
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.release.outputs.version }}
      ZIP_SHA256: ${{ needs.release.outputs.sha256 }}
      RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Validate release values
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::버전 형식이 올바르지 않습니다: $VERSION"
            exit 1
          fi
          if [[ ! "$ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::sha256 형식이 올바르지 않습니다."
            exit 1
          fi
      - name: Verify published zip matches checksum
        run: |
          url="https://github.com/$RELEASE_REPO/releases/download/v$VERSION/Desktoto-$VERSION.zip"
          actual=$(curl -fsSL --retry 5 --retry-delay 5 "$url" | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$ZIP_SHA256" ]; then
            echo "::error::공개된 zip의 sha256이 릴리스 단계의 값과 다릅니다: $url"
            exit 1
          fi
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: huniversal/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update cask and push
        working-directory: tap
        run: |
          cask="Casks/desktoto.rb"
          current=$(sed -n -E 's/^  version "([^"]*)"$/\1/p' "$cask")
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
          if [ "$newest" != "$VERSION" ]; then
            echo "::error::tap의 버전($current)이 릴리스 버전($VERSION)보다 새 버전입니다."
            exit 1
          fi
          sed -i -E "s/^(  version \")[^\"]*(\")/\1${VERSION}\2/" "$cask"
          sed -i -E "s/^(  sha256 \")[^\"]*(\")/\1${ZIP_SHA256}\2/" "$cask"
          grep -q "^  version \"${VERSION}\"$" "$cask"
          grep -q "^  sha256 \"${ZIP_SHA256}\"$" "$cask"
          if git diff --quiet; then
            echo "tap이 이미 최신입니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: desktoto ${VERSION}으로 갱신"
          git push
